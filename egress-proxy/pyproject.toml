[project]
name = "fleetdeck-egress"
version = "0.1.0"
description = "Fleetdeck egress proxy: the only way from an agent to the internet, by allow-list"
requires-python = ">=3.13"
dependencies = [
    "fleetdeck-common",
    "prometheus-client>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetdeck_egress"]

[tool.uv.sources]
fleetdeck-common = { workspace = true }

[project.scripts]
fleetdeck-egress = "fleetdeck_egress.proxy:main"
