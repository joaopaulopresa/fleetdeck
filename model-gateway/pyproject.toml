[project]
name = "fleetdeck-gateway"
version = "0.1.0"
description = "Fleetdeck model gateway: virtual keys in, routed and audited provider calls out"
requires-python = ">=3.13"
dependencies = [
    "fleetdeck-common",
    "fastapi>=0.120",
    "prometheus-client>=0.23",
    "uvicorn>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetdeck_gateway"]

[tool.uv.sources]
fleetdeck-common = { workspace = true }
