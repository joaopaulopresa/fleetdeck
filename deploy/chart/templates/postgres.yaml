apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.image.postgres }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: POSTGRES_USER, value: fleet}
            - {name: POSTGRES_DB, value: fleet}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: fleet-secrets, key: postgres-password}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, fleet, -d, fleet]}
            periodSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
---
# The database accepts connections only from platform pods that are meant to use it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-clients
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {fleetdeck.dev/db-client: "true"}
      ports: [{port: 5432, protocol: TCP}]
