apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleetdeck
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port: {number: 8000}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 8080}
