contract:
  id: CTR-NORTHWIND-2025
  kind: payer
  counterparty: Northwind Mutual Insurance
  title: Provider Participation Agreement
  effective: "2025-01-01"
  clauses:
    - id: "5.2"
      title: Medical necessity
      text: >-
        A Covered Service is medically necessary when it is consistent with generally accepted
        standards of medical practice, including the current guidelines of the relevant
        specialty society, and is clinically appropriate for the Member's condition. Payer shall
        apply the published guideline criteria in effect on the date of service.
    - id: "7.3"
      title: First-level appeal
      text: >-
        Provider may appeal a denied claim in writing within sixty (60) calendar days of the
        date of the denial notice. The appeal shall state the grounds and include the supporting
        clinical documentation. Payer shall decide within thirty (30) calendar days of receipt.
    - id: "7.4"
      title: Second-level appeal
      text: >-
        If the first-level appeal is denied, Provider may request a second-level review by a
        physician of the same specialty within thirty (30) calendar days of the first-level
        decision.
    - id: "12.1"
      title: Good-faith resolution
      text: >-
        The parties shall attempt in good faith to resolve any dispute arising under this
        Agreement through the appeal procedures of Article 7 before invoking this Article.
    - id: "12.2"
      title: Notice of dispute
      text: >-
        A party that considers a final denial to breach this Agreement shall deliver a written
        notice of dispute to the other party within thirty (30) calendar days of the final
        denial. The notice shall identify the claim, the amount in dispute, the clause relied
        upon and the remedy sought.
    - id: "12.3"
      title: Response to notice
      text: >-
        The party receiving a notice of dispute shall respond in writing within forty-five (45)
        calendar days of receipt. Failure to respond within that period is deemed a rejection.
    - id: "12.4"
      title: Arbitration
      text: >-
        If the dispute is not resolved, either party may demand binding arbitration within
        twenty (20) business days after the response period ends. The arbitration is seated in
        Columbus, Ohio, before a single arbitrator.
    - id: "12.6"
      title: Interest on wrongly denied claims
      text: >-
        Amounts found to have been wrongly denied bear simple interest at eight percent (8%) per
        year from the thirtieth day after the original claim was submitted.

