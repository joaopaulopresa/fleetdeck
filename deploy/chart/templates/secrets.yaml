apiVersion: v1
kind: Secret
metadata:
  name: fleet-secrets
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
type: Opaque
data:
  internal-token: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "internal-token") }}
  session-secret: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "session-secret") }}
  postgres-password: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "postgres-password") }}
---
# The real provider key. Mounted only into the model gateway.
apiVersion: v1
kind: Secret
metadata:
  name: provider-key
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.keysNamespace }}
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
