[project]
name = "fleetdeck-operator"
version = "0.1.0"
description = "Fleetdeck operator: reconciles Agent resources into isolated namespaces"
requires-python = ">=3.13"
dependencies = [
    "fleetdeck-common",
    "kopf>=1.38",
    "kubernetes>=34.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetdeck_operator"]

[tool.uv.sources]
fleetdeck-common = { workspace = true }
