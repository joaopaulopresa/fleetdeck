[project]
name = "fleetdeck"
version = "0.1.0"
description = "One isolated, scale-to-zero AI agent per employee on Kubernetes"
requires-python = ">=3.13"
dependencies = [
    "fleetdeck-common",
    "fleetdeck-connectors",
    "fleetdeck-control",
    "fleetdeck-egress",
    "fleetdeck-mock",
    "fleetdeck-gateway",
    "fleetdeck-operator",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common", "control-plane", "operator", "model-gateway", "egress-proxy", "mock-systems", "connectors"]

[tool.uv.sources]
fleetdeck-common = { workspace = true }
fleetdeck-connectors = { workspace = true }
fleetdeck-control = { workspace = true }
fleetdeck-egress = { workspace = true }
fleetdeck-mock = { workspace = true }
fleetdeck-gateway = { workspace = true }
fleetdeck-operator = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "ruff>=0.14",
    "testcontainers[postgres]>=4.13",
    "types-pyyaml",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S", "D"]
ignore = ["D203", "D213", "D105", "D107", "S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S"]
"**/testing.py" = ["D", "S"]
"conftest.py" = ["D"]
"**/migrations/**" = ["D", "S608"]
"**/cli.py" = ["S608"]
"seed/generate.py" = ["E501"]
"e2e/demo/render.py" = ["E501", "D", "S"]
"deploy/chart/dashboards/build.py" = ["E501", "D"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = [
    "common/src",
    "control-plane/src",
    "operator/src",
    "model-gateway/src",
    "egress-proxy/src",
    "mock-systems/src",
    "connectors/src",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["kubernetes.*", "kopf.*", "testcontainers.*", "croniter.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "cluster: needs a k3d cluster (run with make test-cluster)",
    "live: calls a real model through OpenRouter",
]
addopts = "-m 'not cluster and not live' -q --import-mode=importlib"
