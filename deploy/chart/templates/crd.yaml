apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.fleetdeck.dev
spec:
  group: fleetdeck.dev
  scope: Cluster
  names:
    kind: Agent
    plural: agents
    singular: agent
    shortNames: [ag]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Role, type: string, jsonPath: .spec.role}
        - {name: Bundle, type: string, jsonPath: .spec.bundle}
        - {name: Awake, type: boolean, jsonPath: .spec.awake}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [bundle, keysSecret]
              properties:
                displayName: {type: string}
                personId: {type: string, nullable: true}
                personName: {type: string, nullable: true}
                role: {type: string}
                department: {type: string, nullable: true}
                bundle: {type: string}
                tier: {type: string, enum: [strict, team], default: strict}
                awake:
                  type: boolean
                  default: false
                  description: Whether the Hermes pod should run. The activator and the idle reaper flip it.
                suspended: {type: boolean, default: false}
                keysSecret:
                  type: string
                  description: Secret in the system namespace holding the agent's keys.
                extraSkills:
                  type: array
                  description: Approved personal and shared skills, added to the role bundle's.
                  items:
                    type: object
                    required: [name, description, body]
                    properties:
                      name: {type: string}
                      description: {type: string}
                      body: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
