{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
---
# Prometheus reads pod lists for discovery and container metrics from the kubelet. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetdeck-prometheus
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetdeck-prometheus
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fleetdeck-prometheus}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: {{ .Release.Namespace }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      # Platform services that ask to be scraped through pod annotations.
      - job_name: fleetdeck
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [{{ .Release.Namespace }}]}
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true"}
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2
          - {source_labels: [__meta_kubernetes_pod_label_app], target_label: app}
      # Memory and CPU of every container, including the agent pods, from the kubelet.
      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config: {insecure_skip_verify: true}
        kubernetes_sd_configs: [{role: node}]
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: container_memory_working_set_bytes|container_cpu_usage_seconds_total|machine_memory_bytes|machine_cpu_cores
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534}
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.image.prometheus }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d]
          ports: [{containerPort: 9090}]
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 3
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://prometheus:9090", isDefault: true}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - {name: fleetdeck, folder: Fleetdeck, type: file, options: {path: /var/lib/grafana/dashboards}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
spec:
  selector: {app: grafana}
  ports: [{port: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
      annotations:
        checksum/dashboards: {{ (.Files.Glob "dashboards/*.json").AsConfig | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, fsGroup: 472}
      containers:
        - name: grafana
          image: {{ .Values.monitoring.image.grafana }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: {{ .Values.monitoring.grafanaAdminPassword | quote }}}
            - {name: GF_SERVER_ROOT_URL, value: {{ .Values.monitoring.grafanaUrl | quote }}}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/fleet.json}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 3
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: provisioning, configMap: {name: grafana-provisioning}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.monitoring.grafanaHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: grafana, port: {number: 3000}}
{{- end }}
