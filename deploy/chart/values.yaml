image:
  platform: fleetdeck/platform:dev
  web: fleetdeck/web:dev
  hermes: nousresearch/hermes-agent:stable
  postgres: pgvector/pgvector:pg16
  pullPolicy: IfNotPresent
  # Set by `make up` to the built image's id so that pods roll when the code changes.
  buildId: ""
  webBuildId: ""

# Namespace that holds only the agents' keys. The control plane writes them, the operator reads
# them, and nothing else is stored there: the control plane cannot read the provider key.
keysNamespace: fleet-keys

agents:
  idleSeconds: 300
  wakeTimeoutSeconds: 120
  stateStorage: 1Gi
  cpuRequest: 100m
  memoryRequest: 320Mi
  memoryLimit: 768Mi

models:
  default: deepseek/deepseek-v4.1-flash-1017
  restricted: google/gemma-4-26b-a4b-it
  # Where restricted data goes. Empty: the same provider as the default route, which is only
  # acceptable with synthetic data. With real patient data, set an OpenAI-compatible endpoint
  # hosted by the company (and its key in secrets.restrictedApiKey).
  restrictedUpstreamUrl: ""

secrets:
  # Passed by `make up` from .env; never committed.
  openrouterApiKey: ""
  restrictedApiKey: ""

postgres:
  storage: 2Gi

seed:
  enabled: true

egress:
  # Hosts agents may reach through the egress proxy (HTTPS only). A leading dot allows
  # subdomains. Everything else is refused and audited.
  allowedHosts:
    - www.cms.gov
    - www.irs.gov

langfuse:
  enabled: true
  # *.localhost resolves to this machine in every browser; Traefik routes by host name.
  host: langfuse.localhost
  publicUrl: http://langfuse.localhost:8090
  projectId: fleetdeck
  # Local demo sign-in for the Langfuse UI. Change both before exposing the cluster.
  adminEmail: admin@meridian-health.example
  adminPassword: fleetdeck-demo
  image:
    web: docker.langfuse.com/langfuse/langfuse:4
    worker: docker.langfuse.com/langfuse/langfuse-worker:4
    postgres: postgres:17-alpine
    clickhouse: clickhouse/clickhouse-server:26.3.62.3
    redis: redis:7-alpine
    minio: cgr.dev/chainguard/minio:latest-dev

# One MCP connector is deployed for each name. Role bundles list the connectors an agent gets.
connectors: [patient-record, billing, erp, docket, contracts, knowledge, fleet]

demo:
  # The corporate systems' "today", so that deadlines and periods match the recorded demo.
  # Set it to "" to use the real date.
  today: "2026-11-12"

monitoring:
  enabled: true
  grafanaHost: grafana.localhost
  grafanaUrl: http://grafana.localhost:8090
  # Grafana is open to read without sign-in in the local demo; this is the admin password.
  grafanaAdminPassword: fleetdeck-demo
  image:
    prometheus: prom/prometheus:v3.7.3
    grafana: grafana/grafana:12.2.1
