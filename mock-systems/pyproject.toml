[project]
name = "fleetdeck-mock"
version = "0.1.0"
description = "Synthetic corporate systems for the Fleetdeck demo: patient record, billing, ERP, docket, contracts"
requires-python = ">=3.13"
dependencies = [
    "fleetdeck-common",
    "fastapi>=0.120",
    "uvicorn>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetdeck_mock"]

[tool.uv.sources]
fleetdeck-common = { workspace = true }
