image:
  platform: fleetdeck/platform:dev
  hermes: nousresearch/hermes-agent:stable
  postgres: pgvector/pgvector:pg16
  pullPolicy: IfNotPresent
  # Set by `make up` to the built image's id so that pods roll when the code changes.
  buildId: ""

# Namespace that holds only the agents' keys. The control plane writes them, the operator reads
# them, and nothing else is stored there: the control plane cannot read the provider key.
keysNamespace: fleet-keys

agents:
  idleSeconds: 300
  wakeTimeoutSeconds: 120
  stateStorage: 1Gi
  cpuRequest: 100m
  memoryRequest: 320Mi
  memoryLimit: 768Mi

models:
  default: deepseek/deepseek-v4.1-flash-1017
  restricted: google/gemma-4-26b-a4b-it

secrets:
  # Passed by `make up` from .env; never committed.
  openrouterApiKey: ""

postgres:
  storage: 2Gi

seed:
  enabled: true

egress:
  # Hosts agents may reach through the egress proxy (HTTPS only). A leading dot allows
  # subdomains. Everything else is refused and audited.
  allowedHosts:
    - www.cms.gov
    - www.irs.gov
