apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
spec:
  selector: {app: egress-proxy}
  ports: [{port: 3128}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: egress-proxy}
  template:
    metadata:
      labels:
        app: egress-proxy
        fleetdeck.dev/agent-facing: "true"
      annotations:
        fleetdeck.dev/image-id: {{ .Values.image.buildId | quote }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "fleetdeck.podSecurity" . | nindent 8 }}
      volumes: [{name: tmp, emptyDir: {}}]
      containers:
        - name: egress-proxy
          image: {{ .Values.image.platform }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [fleetdeck-egress]
          securityContext: {{- include "fleetdeck.containerSecurity" . | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          env:
            {{- include "fleetdeck.commonEnv" . | nindent 12 }}
            - {name: FLEET_ALLOWED_HOSTS, value: {{ join "," .Values.egress.allowedHosts | quote }}}
          ports: [{containerPort: 3128}, {containerPort: 9100}]
          readinessProbe:
            tcpSocket: {port: 3128}
            periodSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 64Mi}
