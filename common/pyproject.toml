[project]
name = "fleetdeck-common"
version = "0.1.0"
description = "Settings, logging, errors and service clients shared by the Fleetdeck services"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetdeck_common"]
