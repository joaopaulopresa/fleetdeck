[project]
name = "fleetdeck-connectors"
version = "0.1.0"
description = "Fleetdeck connectors: one MCP server per corporate system, acting as the calling person"
requires-python = ">=3.13"
dependencies = [
    "fleetdeck-common",
    "asyncpg>=0.30",
    "mcp>=2.3",
    "uvicorn>=0.38",
]

[project.scripts]
fleetdeck-connector = "fleetdeck_connectors.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetdeck_connectors"]

[tool.uv.sources]
fleetdeck-common = { workspace = true }
