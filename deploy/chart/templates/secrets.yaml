apiVersion: v1
kind: Secret
metadata:
  name: fleet-secrets
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
type: Opaque
data:
  internal-token: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "internal-token") }}
  session-secret: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "session-secret") }}
  postgres-password: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "postgres-password") }}
  connector-db-password: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "connector-db-password") }}
  langfuse-db-password: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "langfuse-db-password") }}
  langfuse-clickhouse-password: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "langfuse-clickhouse-password") }}
  langfuse-redis-password: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "langfuse-redis-password") }}
  langfuse-minio-password: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "langfuse-minio-password") }}
  langfuse-nextauth-secret: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "langfuse-nextauth-secret") }}
  langfuse-salt: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "langfuse-salt") }}
  langfuse-encryption-key: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "langfuse-encryption-key" "hex" true) }}
  langfuse-public-key: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "langfuse-public-key" "prefix" "pk-lf-") }}
  langfuse-secret-key: {{ include "fleetdeck.stableSecret" (dict "root" . "key" "langfuse-secret-key" "prefix" "sk-lf-") }}
---
# The real provider key. Mounted only into the model gateway.
apiVersion: v1
kind: Secret
metadata:
  name: provider-key
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.keysNamespace }}
  labels: {{- include "fleetdeck.labels" . | nindent 4 }}
