[project]
name = "fleetdeck-control"
version = "0.1.0"
description = "Fleetdeck control plane: agents, cases, policies, audit, broker, scheduler, activator"
requires-python = ">=3.13"
dependencies = [
    "fleetdeck-common",
    "alembic>=1.17",
    "asyncpg>=0.30",
    "croniter>=6.0",
    "fastapi>=0.120",
    "kubernetes>=34.1",
    "prometheus-client>=0.23",
    "pyjwt>=2.10",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetdeck_control"]

[tool.uv.sources]
fleetdeck-common = { workspace = true }

[project.scripts]
fleetdeck-control = "fleetdeck_control.cli:main"
